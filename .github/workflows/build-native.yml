name: Build Orbis Store Native

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - ".github/workflows/build-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orbis Store
        uses: actions/checkout@v4

      - name: Checkout current OpenOrbis toolchain
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          path: openorbis
          submodules: recursive

      - name: Inspect current OpenOrbis build files
        run: |
          cd openorbis
          echo "--- root ---"
          ls -la
          echo "--- scripts/build files ---"
          find . -maxdepth 3 -type f \( -name "*.sh" -o -name "Makefile" -o -name "CMakeLists.txt" \) | sort


      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: orbis-store-native-ps4
          path: native/IV0000-BREW00001_00-ORBISSTORE000001.pkg
          if-no-files-found: error
