name: Build Peppy Store Native
# CI trigger refresh for BGFT HTTP fix

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - "peppy-icon0-1.png"
      - "fight-ps4.mp3"
      - "acendaofarol-ps4.mp3"
      - ".github/workflows/build-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Peppy Store
        uses: actions/checkout@v4

      - name: Download official OpenOrbis toolchain v0.5.4
        run: |
          curl -L --fail --retry 3 -o /tmp/openorbis.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/openorbis"
          tar -xzf /tmp/openorbis.tar.gz -C "$GITHUB_WORKSPACE/openorbis"
          TOOLCHAIN_ROOT="$(dirname "$(dirname "$(dirname "$(find "$GITHUB_WORKSPACE/openorbis" -type f -name PkgTool.Core -path "*/bin/linux/*" -print -quit)")")")"
          test -n "$TOOLCHAIN_ROOT"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"
          chmod +x "$TOOLCHAIN_ROOT/bin/linux/"* || true
          echo "Toolchain root: $TOOLCHAIN_ROOT"
          find "$TOOLCHAIN_ROOT/bin/linux" -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Build official create-fself
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/create-fself.git /tmp/create-fself
          cd /tmp/create-fself/cmd/create-fself
          go build -modfile=go-linux.mod -o "$OO_PS4_TOOLCHAIN/bin/linux/create-fself" .
          chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          "$OO_PS4_TOOLCHAIN/bin/linux/create-fself" -h || true
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"

      - name: Prepare package assets
        run: |
          mkdir -p native/sce_sys/about
          RIGHT_SPRX="$(find "$OO_PS4_TOOLCHAIN" -type f -path "*/sce_sys/about/right.sprx" -o -name right.sprx | head -n 1)"
          test -n "$RIGHT_SPRX"
          cp "$RIGHT_SPRX" native/sce_sys/about/right.sprx
          ls -lh native/sce_sys/about/right.sprx
          mkdir -p native/sce_sys
          cp peppy-icon0-1.png native/sce_sys/icon0.png
          python3 - <<'PY'
          from pathlib import Path
          import struct

          data = Path("native/sce_sys/icon0.png").read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
              raise SystemExit("PEPPY icon must be a valid PNG")
          header = struct.unpack(">IIBBBBB", data[16:29])
          if header != (512, 512, 8, 2, 0, 0, 0):
              raise SystemExit(f"PEPPY icon must be 512x512, RGB, 8-bit, noninterlaced; got {header}")
          print("PEPPY icon verified: 512x512 RGB PNG")
          PY
          cmp peppy-icon0-1.png native/sce_sys/icon0.png
          sha256sum peppy-icon0-1.png native/sce_sys/icon0.png
          file native/sce_sys/icon0.png

      - name: Install linker and UI asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lld python3-pil fonts-dejavu-core ffmpeg
          command -v ld.lld
          ld.lld --version

      - name: Check reviewed Archive source policy
        run: python3 native/scripts/archive_policy.py --policy native/archive_sources.json --output native/archive_sources.h --check

      - name: Test package downloads on host
        run: |
          cd native
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pthread \
            -Itests/downloads/stubs tests/downloads/downloads_test.cpp \
            -Wl,--wrap=fwrite -Wl,--wrap=fflush -Wl,--wrap=fclose -Wl,--wrap=malloc -Wl,--wrap=setvbuf \
            -o /tmp/peppy-download-tests
          /tmp/peppy-download-tests

      - name: Test HTTP range framing on host
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror \
            native/tests/downloads/http_range_test.cpp -o /tmp/peppy-http-range-tests
          /tmp/peppy-http-range-tests

      - name: Test measured download speed on host
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror \
            native/tests/download_meter/meter_test.cpp -o /tmp/peppy-download-meter-tests
          /tmp/peppy-download-meter-tests

      - name: Test concurrent package downloads on host
        run: |
          cd native
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pthread \
            -Itests/parallel_download/stubs tests/parallel_download/parallel_test.cpp \
            -Wl,--wrap=malloc -Wl,--wrap=close -Wl,--wrap=fsync \
            -Wl,--wrap=fclose -Wl,--wrap=fflush \
            -o /tmp/peppy-parallel-download-tests
          /tmp/peppy-parallel-download-tests

      - name: Test native installation on host
        run: |
          cd native
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pthread \
            -Itests/install/stubs tests/install/install_test.cpp \
            -Wl,--wrap=write -Wl,--wrap=fsync -Wl,--wrap=close -Wl,--wrap=rename \
            -Wl,--wrap=lstat -Wl,--wrap=open -Wl,--wrap=__open_2 -Wl,--wrap=fstat -Wl,--wrap=fclose \
            -o /tmp/peppy-install-tests
          /tmp/peppy-install-tests

      - name: Test MediaFire source parsing on host
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror \
            native/tests/downloads/mediafire_parser_test.cpp -o /tmp/peppy-mediafire-parser-tests
          /tmp/peppy-mediafire-parser-tests

      - name: Test local package delivery on host
        run: |
          cd native
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pthread \
            -Itests/pkg_server/stubs tests/pkg_server/server_test.cpp \
            -o /tmp/peppy-pkg-server-tests-bin
          /tmp/peppy-pkg-server-tests-bin

      - name: Test native music on host
        run: |
          cd native
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pthread \
            -Itests/music/stubs tests/music/music_test.cpp -o /tmp/peppy-music-tests-bin
          /tmp/peppy-music-tests-bin

      - name: Test store controller handoff on host
        run: |
          python3 native/scripts/generate-ui-assets.py --icon peppy-icon0-1.png --output native/ui_assets.h
          python3 native/scripts/generate-catalog.py --catalog native/catalog.json --output native/ui_catalog.h
          g++ -std=c++11 -O2 -Wall -Wextra -Werror native/scripts/preview-ui.cpp -o /tmp/peppy-ui-controls
          /tmp/peppy-ui-controls --check-controller

      - name: Test package directory manifest
        run: python3 native/tests/gp4/normalize_test.py

      - name: Test uploaded package inspection
        run: python3 native/tests/catalog_import/inspect_test.py

      - name: Test catalog sources
        run: python3 native/tests/catalog/catalog_test.py

      - name: Build Peppy Store files
        run: |
          cd native
          make pkg.gp4
          cat pkg.gp4

      - name: Package with compatible OpenSSL
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/native \
            -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
            ubuntu:20.04 bash -lc '
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y libssl1.1 &&
              chmod +x "/workspace/openorbis/OpenOrbis/PS4Toolchain/bin/linux/PkgTool.Core" &&
              "/workspace/openorbis/OpenOrbis/PS4Toolchain/bin/linux/PkgTool.Core" pkg_build pkg.gp4 .
            '
          test -f native/IV0000-BREW00001_00-ORBISSTORE000001.pkg
          ls -lh native/IV0000-BREW00001_00-ORBISSTORE000001.pkg

      - name: Validate generated PKG
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/native \
            -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
            ubuntu:20.04 bash -lc '
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y libssl1.1 &&
              chmod +x "/workspace/openorbis/OpenOrbis/PS4Toolchain/bin/linux/PkgTool.Core" &&
              echo "===== PKG VALIDATION =====" &&
              "/workspace/openorbis/OpenOrbis/PS4Toolchain/bin/linux/PkgTool.Core" pkg_validate --verbose IV0000-BREW00001_00-ORBISSTORE000001.pkg &&
              echo "===== PKG ENTRIES =====" &&
              "/workspace/openorbis/OpenOrbis/PS4Toolchain/bin/linux/PkgTool.Core" pkg_listentries IV0000-BREW00001_00-ORBISSTORE000001.pkg
            '
          sha256sum native/IV0000-BREW00001_00-ORBISSTORE000001.pkg native/eboot.bin

      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: peppy-store-native-ps4
          path: native/IV0000-BREW00001_00-ORBISSTORE000001.pkg
          if-no-files-found: error
