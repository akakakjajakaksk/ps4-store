name: Build Orbis Store Native

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - ".github/workflows/build-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orbis Store
        uses: actions/checkout@v4

      - name: Download official OpenOrbis toolchain v0.5.4
        run: |
          curl -L --fail --retry 3 -o /tmp/openorbis.tar.gz \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/openorbis"
          tar -xzf /tmp/openorbis.tar.gz -C "$GITHUB_WORKSPACE/openorbis"
          TOOLCHAIN_ROOT="$(dirname "$(dirname "$(dirname "$(find "$GITHUB_WORKSPACE/openorbis" -type f -name PkgTool.Core -path "*/bin/linux/*" -print -quit)")")")"
          test -n "$TOOLCHAIN_ROOT"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"
          chmod +x "$TOOLCHAIN_ROOT/bin/linux/"* || true
          echo "Toolchain root: $TOOLCHAIN_ROOT"
          find "$TOOLCHAIN_ROOT/bin/linux" -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Prepare package assets
        run: |
          mkdir -p native/sce_sys
          cp "$OO_PS4_TOOLCHAIN/bin/data/icon0.png" native/sce_sys/icon0.png

      - name: Build Orbis Store
        run: |
          cd native
          make

      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: orbis-store-native-ps4
          path: native/IV0000-BREW00001_00-ORBISSTORE000001.pkg
          if-no-files-found: error
