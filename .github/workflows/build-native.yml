name: Build Orbis Store Native

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - ".github/workflows/build-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orbis Store
        uses: actions/checkout@v4

      - name: Build with official OpenOrbis toolchain
        uses: OpenOrbis/toolchain-action@main
        with:
          version: latest
          command: cd native; make

      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: orbis-store-native-ps4
          path: native/IV0000-BREW00001_00-ORBISSTORE000001.pkg
          if-no-files-found: error
