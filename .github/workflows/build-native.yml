name: Build Orbis Store Native

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - ".github/workflows/build-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Orbis Store
        uses: actions/checkout@v4

      - name: Checkout current OpenOrbis toolchain
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          path: openorbis
          submodules: recursive

      - name: Install OpenOrbis toolchain
        run: |
          cd openorbis
          chmod +x scripts/*.sh || true
          ./scripts/000-install-dependencies-ubuntu.sh
          ./scripts/001-download-llvm.sh
          ./scripts/002-build-toolchain.sh
          ./scripts/003-build-libraries.sh

      - name: Build Orbis Store
        env:
          OO_PS4_TOOLCHAIN: ${{ github.workspace }}/openorbis
        run: |
          cd native
          make

      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: orbis-store-native-ps4
          path: native/IV0000-BREW00001_00-ORBISSTORE000001.pkg
          if-no-files-found: error
