<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbis Store</title><link rel="stylesheet" href="style.css"></head><body>
<div class="top"><div class="logo">ORBIS <b>STORE</b></div><div class="music"><span>♫ FIGHT! — Aests</span><button id="musicBtn">▶ Música</button></div></div>
<div class="tabs" id="nav"><button class="active" data-view="home">INÍCIO</button><button data-view="new">NOVIDADES</button><button data-view="popular">MAIS BAIXADOS</button><button data-view="favorites">FAVORITOS</button><button data-view="files">MEUS ARQUIVOS</button><button data-view="downloads">DOWNLOADS</button></div>
<main><section class="banner"><div><small>HOMEBREW STORE • PS4</small><h1>Biblioteca da comunidade</h1><p>Uma interface leve, organizada e feita para navegar com controle.</p></div><div class="symbols">△ ○ × □</div></section>
<div class="toolbar"><input id="search" placeholder="Pesquisar por nome..."><div id="cats"><button class="on" data-cat="all">Todos</button><button data-cat="Jogos">Jogos</button><button data-cat="Emuladores">Emuladores</button><button data-cat="Utilitários">Utilitários</button><button data-cat="Temas">Temas</button><button data-cat="Desenvolvimento">Dev</button></div></div>
<section id="catalog"><div class="sectiontitle"><h2 id="pageTitle">Catálogo</h2><span id="count"></span></div><div id="grid" class="grid"></div></section>
<section id="filesPanel" class="hidden"><div class="sectiontitle"><h2>Meus arquivos</h2><button id="addFile" class="blue">+ Adicionar URL</button></div><p class="muted">Seus links ficam salvos neste navegador.</p><div id="myFiles" class="grid"></div></section>
<section id="downloadsPanel" class="hidden"><div class="sectiontitle"><h2>Downloads iniciados</h2></div><div id="queue"></div></section></main>
<div id="details" class="modal hidden"><div class="dialog"><button class="close" data-close="details">×</button><div id="detailBody"></div></div></div>
<div id="upload" class="modal hidden"><form id="fileForm" class="dialog"><button type="button" class="close" data-close="upload">×</button><h2>Adicionar arquivo próprio</h2><input id="fname" required placeholder="Nome"><input id="furl" required type="url" placeholder="https://.../arquivo.pkg"><select id="ftype"><option>PKG</option><option>ELF</option><option>BIN</option></select><input id="fversion" placeholder="Versão"><textarea id="fdesc" placeholder="Descrição"></textarea><button class="blue" type="submit">Salvar</button></form></div>
<div class="soundcloud"><iframe id="scPlayer" width="1" height="1" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/aests/fight&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false"></iframe></div>
<script src="https://w.soundcloud.com/player/api.js"></script><script src="app.js"></script></body></html>
